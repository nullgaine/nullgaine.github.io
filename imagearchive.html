<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="N/A市で回収・保存された画像記録の保管ページです。">
  <title>N/A市画像記録保管庫</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/records.css">
</head>
<body class="records-page">
  <div id="header"></div>

  <main class="records-shell">
    <section class="records-masthead" aria-labelledby="image-records-title">
      <div class="records-heading">
        <p class="records-kicker">N/A CITY / IMAGE RECORDS DIVISION</p>
        <h1 id="image-records-title">画像記録保管庫</h1>
        <p class="records-lead">静止画、写真、観測画像および図像資料を保管する区画です。</p>
      </div>
      <dl class="records-status" aria-label="画像記録保管庫の状態">
        <div><dt>TERMINAL</dt><dd>NA-IM-01</dd></div>
        <div><dt>RECORDS</dt><dd>0000</dd></div>
        <div><dt>STATUS</dt><dd>INDEXING</dd></div>
      </dl>
    </section>

    <div class="records-subheading">
      <h2>公開記録</h2>
      <span>DISPLAYING 0000 / 0000</span>
    </div>

    <section class="records-empty" aria-labelledby="image-empty-title">
      <div>
        <p class="records-empty-code">CATALOG STATUS / PREPARING</p>
        <h2 id="image-empty-title">公開可能な画像記録は現在整理中です。</h2>
        <p>記録番号と閲覧区分の割り当てが完了した資料から、順次この保管庫へ登録されます。</p>
      </div>
    </section>

    <section class="records-footnote" aria-label="画像記録の注意事項">
      <p><span>NOTICE</span>未整理・権限未確認の画像記録は表示されません。</p>
      <a href="archive.html">記録保管庫へ戻る</a>
    </section>
  </main>

  <div id="footer"></div>
  <script src="common.js"></script>
  <script>
    async function loadPart(id, file) {
      const response = await fetch(file);
      document.getElementById(id).innerHTML = await response.text();
    }
    loadPart("header", "partials/header.html");
    loadPart("footer", "partials/footer.html");
  </script>
</body>
</html>
