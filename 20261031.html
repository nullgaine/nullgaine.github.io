<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>monitoring.exe — 20261031</title>
<style>
:root{color-scheme:dark;--ivory:#fff8e7;--red:#ed3348}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--ivory);font:12px/1.8 "Courier New",monospace;min-height:100svh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0002 3px 4px);z-index:5}
.shell{max-width:1680px;margin:auto;padding:28px 32px}header,footer{display:flex;justify-content:space-between;gap:16px;color:#9d998e;font-size:12px;letter-spacing:.16em}header{border-bottom:1px solid #504d45;padding-bottom:15px}.identity{color:var(--ivory)}.led{display:inline-block;width:5px;height:5px;background:var(--red);margin-right:9px}
main{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.65fr) minmax(240px,1.05fr);gap:20px;margin:48px 0 30px;min-height:590px;height:calc(100svh - 180px);max-height:900px}
.left{display:grid;grid-template-rows:1fr 1fr;gap:24px;min-height:0}.window{border:1px solid #b6b1a4;display:flex;flex-direction:column;min-height:0;background:#050505}.titlebar{height:29px;flex:none;border-bottom:1px solid #666258;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;letter-spacing:.025em}.marks{font-size:12px;color:#888479}.plot{flex:1;min-height:0;position:relative;margin:14px 10px 4px}.plot canvas{width:100%;height:100%;display:block}.readout{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;padding:8px 12px 11px;font-size:12px;color:#a8a397;letter-spacing:.08em}.red{color:var(--red)}
.subject{position:relative;overflow:hidden;border:1px solid #45423b;min-height:400px;background:#090909}.subject canvas{position:absolute;width:100%;height:100%;inset:0;opacity:.27;image-rendering:pixelated}.subject:before,.subject:after{content:"";position:absolute;left:16px;right:16px;height:15px;border-left:1px solid #bcb6a7;border-right:1px solid #bcb6a7;z-index:2}.subject:before{top:17px;border-top:1px solid #bcb6a7}.subject:after{bottom:17px;border-bottom:1px solid #bcb6a7}.subject-label{position:absolute;top:34px;left:30px;font-size:12px;letter-spacing:.18em;color:#aaa397}
.censor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.censor strong{font-size:clamp(20px,2.4vw,38px);font-weight:400;letter-spacing:.05em;background:#050505;padding:12px 6px;white-space:nowrap;position:relative}.censor small{text-align:center;padding:0 10px;margin-top:15px;font-size:12px;letter-spacing:.23em;color:#8e897f}.subject-bottom{position:absolute;bottom:34px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:12px;color:#9d978b}.tear{position:absolute;left:0;right:0;height:5%;background:#fff8e70c;opacity:0}
.log-window{border-color:#69655c}.logs{padding:16px 13px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#555 #050505;overflow-wrap:anywhere}.entry{margin:0 0 16px;border-left:1px solid #3b3832;padding-left:10px;animation:arrive .4s ease-out}.entry time{display:block;color:#77746b;font-size:12px;letter-spacing:.03em}.entry .message{font-size:14px}.entry.alert{border-color:var(--red);color:#eeaaa9}.cursor{color:var(--ivory)}footer{border-top:1px solid #36332c;padding-top:12px;align-items:center}button{color:#a9a396;border:1px solid #504d45;background:transparent;font:12px monospace;padding:6px 10px;cursor:pointer}button:hover,button:focus-visible{color:var(--ivory);border-color:var(--ivory)}@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:1500px){main{gap:28px}.shell{padding-top:40px}}
@media(max-width:900px){.shell{padding:20px 16px}main{grid-template-columns:minmax(160px,1fr) minmax(200px,1.4fr);height:auto;max-height:none;min-height:0;margin-top:28px}.left,.subject{height:520px}.log-window{grid-column:1/-1;height:300px}header{letter-spacing:.06em}}
@media(max-width:480px){main{grid-template-columns:minmax(120px,1fr) minmax(160px,1.2fr);gap:10px}.shell{padding:15px 10px}.left{gap:16px}.left,.subject{height:440px}.censor strong{font-size:18px;padding:10px 0}.censor small{font-size:12px;letter-spacing:.05em}.subject-label{left:20px;font-size:12px}.subject-bottom{left:20px;right:20px;font-size:12px}.readout{font-size:12px;padding:8px 6px}.titlebar{font-size:12px;padding:0 6px}.plot{margin:10px 5px 0}.marks{display:none}header{font-size:12px}footer{font-size:12px;letter-spacing:.03em}}
@media(prefers-reduced-motion:reduce){.entry{animation:none}}
</style></head><body>
<div class="shell"><header><span class="identity"><span class="led"></span>N/A CITY / OBSERVATION TERMINAL</span><span>ARCHIVE : 2026.10.31</span></header>
<main>
<div class="left">
<section class="window" aria-label="心電図風モニター"><div class="titlebar"><span>monitoring.exe</span><span class="marks">─ □ ×</span></div><div class="plot"><canvas id="ecg" aria-label="赤色の心電図風波形"></canvas></div><div class="readout"><span>CH.01 / SIGNAL</span><span class="red" id="pulse">072 BPM</span></div></section>
<section class="window" aria-label="不規則なバーモニター"><div class="titlebar"><span>monitoring.exe</span><span class="marks">─ □ ×</span></div><div class="plot"><canvas id="bars" aria-label="アイボリー色の不規則に動くバー"></canvas></div><div class="readout"><span>CH.02 / RESPONSE</span><span>UNIT : N/A</span></div></section>
</div>
<section class="subject" aria-label="検閲された観測映像"><canvas id="noise" aria-hidden="true"></canvas><div class="subject-label">SUBJECT / UNIDENTIFIED</div><div class="tear" id="tear"></div><div class="censor"><strong id="censor">【CENSORED】</strong><small>VISUAL ACCESS RESTRICTED</small></div><div class="subject-bottom"><span>REC ●</span><span>FEED_005</span></div></section>
<section class="window log-window" aria-label="観測ログ"><div class="titlebar"><span>observation.log</span><span class="marks">READ ONLY</span></div><div class="logs" id="logs" tabindex="0" aria-label="接続と観測の記録"></div><div class="readout"><span>SESSION / ACTIVE</span><span class="cursor">▌</span></div></section>
</main><footer><span>EXTERNAL OBSERVATION / 005</span><button id="pause" type="button" aria-pressed="false">一時停止</button><span id="clock"></span></footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused=reduced,elapsed=0,last=0,lastNoise=-1,lastLog=0,logIndex=0;
const surfaces=['ecg','bars'].map(id=>({el:$(id),ctx:$(id).getContext('2d'),w:1,h:1}));
function resize(){for(const s of surfaces){const r=s.el.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);s.w=r.width;s.h=r.height;s.el.width=Math.round(r.width*d);s.el.height=Math.round(r.height*d);s.ctx.setTransform(d,0,0,d,0,0)}}
new ResizeObserver(resize).observe(document.querySelector('main'));resize();
const nc=$('noise'),nx=nc.getContext('2d');nc.width=120;nc.height=180;
function noise(){const d=nx.createImageData(120,180);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*170;d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=255}nx.putImageData(d,0,0)}
function wave(t){const p=((t%1)+1)%1;const g=(m,s,a)=>a*Math.exp(-Math.pow((p-m)/s,2));return g(.18,.035,.12)-g(.37,.015,.18)+g(.4,.011,1)-g(.43,.018,.32)+g(.65,.07,.23)}
const heights=Array(12).fill(.3),targets=heights.map(()=>Math.random()*.8+.1);
let targetTime=0;
function draw(t,dt){
const a=surfaces[0],c=a.ctx,w=a.w,h=a.h;c.clearRect(0,0,w,h);c.strokeStyle='#201419';c.lineWidth=.5;
for(let y=0;y<h;y+=24){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
c.beginPath();for(let x=0;x<w;x++){const y=h*.62-wave(t*1.2-(w-x)/90)*h*.43;x?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle='#FF0000';c.lineWidth=1.4;c.shadowBlur=5;c.shadowColor='#FF0000';c.stroke();c.shadowBlur=0;
c.beginPath();c.arc(w-2,h*.62-wave(t*1.2)*h*.43,2,0,Math.PI*2);c.fillStyle='#FF0000';c.fill();
const b=surfaces[1],bc=b.ctx;bc.clearRect(0,0,b.w,b.h);
if(t>targetTime){targets.forEach((_,i)=>targets[i]=.06+Math.random()*.89);targetTime=t+.18+Math.random()*.4}
heights.forEach((v,i)=>{heights[i]+=(targets[i]-v)*Math.min(1,dt*7);const step=b.w/12,rows=18,n=Math.round(heights[i]*rows);for(let j=0;j<rows;j++){bc.fillStyle=j<n?'#fff8e7':'#191813';bc.fillRect(i*step+2,b.h-(j+1)*(b.h/rows),Math.max(1,step-4),Math.max(1,b.h/rows-3))}});
if(t-lastNoise>.11){noise();lastNoise=t;const glitch=Math.random()<.06;$('tear').style.opacity=glitch?'1':'0';$('tear').style.top=Math.random()*90+'%';$('censor').style.transform=glitch?'translateX(3px)':'none'}
}
function device(){const u=navigator.userAgent;if(/iPhone/i.test(u))return'iPhone';if(/iPad/i.test(u)||(/Macintosh/i.test(u)&&navigator.maxTouchPoints>1))return'iPad';if(/Android/i.test(u))return'Android';if(/Windows/i.test(u))return'Windows';if(/Mac/i.test(u))return'Mac';if(/Linux/i.test(u))return'Linux';return'不明な端末'}
function stamp(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
const initial=[device()+'の接続を確認','表示領域を取得：'+innerWidth+' × '+innerHeight,'言語設定を取得：'+navigator.language,'観測端末との通信を確立','信号を受信しました。','観測対象を照合中……','該当する対象がありません。','映像出力を制限しました。','観測を継続します。'];
const ongoing=['信号を受信しました。','応答を待機しています。','波形を記録中……','観測対象が一致しません。','映像出力：CENSORED','照合を再試行しています。','接続を確認しました。','観測を継続します。'];
function addLog(){const box=$('logs'),follow=box.scrollHeight-box.scrollTop-box.clientHeight<40;const line=document.createElement('p');line.className='entry';const msg=logIndex<initial.length?initial[logIndex]:ongoing[(logIndex-initial.length)%ongoing.length];if(/ありません|一致しません/.test(msg))line.classList.add('alert');const date=document.createElement('time');date.textContent=stamp(new Date());const body=document.createElement('span');body.className='message';body.textContent=msg;line.append(date,body);box.append(line);while(box.children.length>60)box.firstChild.remove();if(follow)box.scrollTop=box.scrollHeight;logIndex++}
function updateButton(){$('pause').textContent=paused?'再生':'一時停止';$('pause').setAttribute('aria-pressed',String(paused))}
$('pause').onclick=()=>{paused=!paused;updateButton()};updateButton();addLog();draw(0,0);noise();
function frame(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(!paused&&!document.hidden){elapsed+=dt;draw(elapsed,dt);if(elapsed-lastLog>3.1){addLog();lastLog=elapsed}$('clock').textContent=stamp(new Date());$('pulse').textContent=String(72+Math.round(Math.sin(elapsed*.3)*2)).padStart(3,'0')+' BPM'}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
