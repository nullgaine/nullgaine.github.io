<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「箱」簡易接続装置</title>
  <style>
    :root {
      color-scheme: dark;
      --terminal-bg: #050505;
      --terminal-panel: #0b0b0b;
      --terminal-text: #f2f2f2;
      --terminal-muted: #8d978d;
      --terminal-line: #777;
      --terminal-accent: #b9cab9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 14px;
      background: #111;
      color: var(--terminal-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
    }

    #addendum {
      width: min(100%, 680px);
      min-height: 400px;
      margin: 0 auto;
    }

    #chatbox {
      width: 100%;
      height: min(56vh, 420px);
      min-height: 300px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid var(--terminal-line);
      background: var(--terminal-bg);
      color: var(--terminal-text);
      text-align: left;
      scrollbar-color: #555 #111;
    }

    #progressbar {
      display: block;
      margin: 0 0 12px;
      color: var(--terminal-accent);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #chatlog {
      display: grid;
      gap: 9px;
    }

    .chat-line {
      margin: 0;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-line.user {
      color: #d7d7d7;
    }

    .chat-line.shirase {
      color: #fff;
    }

    .speaker {
      margin-right: 0.55em;
      color: var(--terminal-accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #chatForm {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    #chatForm label {
      color: var(--terminal-muted);
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    #chatInput {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #555;
      border-radius: 0;
      outline: none;
      background: #1a1a1a;
      color: var(--terminal-text);
      font: inherit;
    }

    #chatInput:focus {
      border-color: #aaa;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    #sendBtn {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid #777;
      border-radius: 0;
      background: #ddd;
      color: #111;
      cursor: pointer;
      font: inherit;
    }

    #sendBtn:hover:not(:disabled),
    #sendBtn:focus-visible:not(:disabled) {
      background: #fff;
    }

    #sendBtn:disabled,
    #chatInput:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #connectionStatus {
      min-height: 1.5em;
      margin: 8px 0 0;
      color: var(--terminal-muted);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-align: left;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 10px;
      }

      #chatbox {
        height: 58vh;
        min-height: 280px;
        padding: 12px;
      }

      #chatForm {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      #chatForm label {
        grid-column: 1 / -1;
        text-align: left;
      }
    }
  </style>
</head>

      ],

      ],

    const REPEAT_FALLBACKS = [

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      setupChatUI();
      let dictionaryLoaded = true;

      try {
        const response = await fetch("responses.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        responses = await response.json();
      } catch (error) {
        dictionaryLoaded = false;
        console.error("辞書読み込み失敗。内蔵データを使用します:", error);
        responses = {
          "こんに": "（通信が不安定なようだ……）",
          "ヒント": "……今はうまく拾えない。少し時間を置いてくれるかい？"
        };
      }

      buildResponseIndex();
      startProgress(dictionaryLoaded);
    }

    function setupChatUI() {
      const chatroom = `
        <div id="chatbox">
          <div id="progressbar" aria-hidden="true"></div>
          <div id="chatlog" role="log" aria-live="polite" aria-relevant="additions text"></div>
        </div>
        <form id="chatForm">
          <label for="chatInput">INPUT</label>
          <input type="text" id="chatInput" maxlength="60" placeholder="メッセージを入力" autocomplete="off" disabled>
          <button type="submit" id="sendBtn" disabled>送信</button>
        </form>
        <p id="connectionStatus" aria-live="polite">DICTIONARY: LOADING / CONNECTION: STANDBY</p>
      `;

      const addendum = document.getElementById("addendum");
      addendum.innerHTML = chatroom;

      document.getElementById("chatForm").addEventListener("submit", event => {
        event.preventDefault();
        send();
      });
    }

    function startProgress(dictionaryLoaded) {
      let progress = 0;
      const progressbar = document.getElementById("progressbar");
      const button = document.getElementById("sendBtn");
      const input = document.getElementById("chatInput");
      const status = document.getElementById("connectionStatus");

      function tick() {
        progress = Math.min(progress + 1, 100);
        const bar = "#".repeat(Math.floor(progress / 5));
        progressbar.textContent = `>該当しないアクセスが確認されました。接続します。\n${bar} ${progress}%`;

        if (progress < 100) {
          setTimeout(tick, 30);
          return;
        }

        progressbar.textContent = `>こちら、世界の外側N/A市です。ごきげんよう、内側の方。\n${bar} 100%\n`;
        button.disabled = false;
        input.disabled = false;
        input.focus();
        status.textContent = dictionaryLoaded
          ? "DICTIONARY: ONLINE / CONNECTION: ESTABLISHED / ENTER: SEND"
          : "DICTIONARY: DEGRADED / CONNECTION: ESTABLISHED / ENTER: SEND";
        document.getElementById("addendum").setAttribute("aria-busy", "false");
        appendLine("Shirase", "ちゃんと届いているかい？", "shirase");
      }

      setTimeout(tick, 50);
    }

    function normalize(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase()
        .replace(/\s+/g, "")
        .replace(/[_\-‐‑‒–—―./:・,，、!?！？"'「」『』（）()\[\]{}]/g, "");
    }

    function buildResponseIndex() {
      const candidates = [];

      Object.keys(responses).forEach(topic => {
        const term = normalize(topic);
        if (term) candidates.push({ topic, term, priority: 2 });
      });

      Object.entries(TOPIC_ALIASES).forEach(([topic, aliases]) => {
        aliases.forEach(alias => {
          const term = normalize(alias);
          if (term) candidates.push({
            topic,
            term,
            priority: topic === "ヒント" ? 0 : 1
          });
        });
      });

      responseIndex = candidates.sort((a, b) =>
        b.term.length - a.term.length || b.priority - a.priority
      );
    }

    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, index) => index);

      for (let i = 1; i <= a.length; i += 1) {
        let previous = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j += 1) {
          const saved = row[j];
          row[j] = Math.min(
            row[j] + 1,
            row[j - 1] + 1,
            previous + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
          previous = saved;
        }
      }

      return row[b.length];
    }

    function findTopic(message) {
      const normalizedMessage = normalize(message);
      if (!normalizedMessage) return "";

      const direct = responseIndex.find(entry => normalizedMessage.includes(entry.term));
      if (direct) return direct.topic;

      if (normalizedMessage.length > 12) return "";

      const nearest = responseIndex
        .filter(entry => entry.term.length >= 2)
        .map(entry => ({ ...entry, distance: editDistance(normalizedMessage, entry.term) }))
        .sort((a, b) => a.distance - b.distance || b.term.length - a.term.length)[0];

      if (!nearest) return "";
      const allowance = nearest.term.length >= 8 ? 2 : 1;
      return nearest.distance <= allowance ? nearest.topic : "";
    }

    function getStoredValue(key) {
      try {
        return sessionStorage.getItem(key);
      } catch (_) {
        return null;
      }
    }

    function setStoredValue(key, value) {
      try {
        sessionStorage.setItem(key, String(value));
      } catch (_) {
        // Storage is optional. The conversation still works without it.
      }
    }

    function getPersistentValue(key) {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return null;
      }
    }

    function setPersistentValue(key, value) {
      try {
        localStorage.setItem(key, String(value));
      } catch (_) {
        // Storage is optional. The conversation still works without it.
      }
    }

    function isFollowUp(message) {
      const normalizedMessage = normalize(message);
      return FOLLOW_UP_TERMS.some(term => normalizedMessage.includes(normalize(term)));
    }

    function nextProjectCHint() {
      const current = Number(getStoredValue("shirase_project_c_hint") || 0);
      const level = Number.isFinite(current) ? Math.min(Math.max(current, 0), PROJECT_C_HINTS.length - 1) : 0;
      setStoredValue("shirase_project_c_hint", Math.min(level + 1, PROJECT_C_HINTS.length - 1));
      return PROJECT_C_HINTS[level];
    }

    function repeatedReply(topic, message, lastTopic) {
      const currentInput = normalize(message);
      const previousInput = getStoredValue("shirase_last_input") || "";

      if (!topic || topic === "プロジェクトC" || topic !== lastTopic || currentInput !== previousInput) {
        setStoredValue("shirase_repeat_count", 0);
        return "";
      }

      const current = Number(getStoredValue("shirase_repeat_count") || 0);
      const level = Number.isFinite(current) ? Math.max(current, 0) : 0;
      const replies = REPEAT_REPLIES[topic] || REPEAT_FALLBACKS;
      setStoredValue("shirase_repeat_count", level + 1);
      return replies[Math.min(level, replies.length - 1)];
    }

    function contextualReply(topic) {
      if (topic === "プロジェクトC") return nextProjectCHint();
      if (CONTEXT_REPLIES[topic]) return CONTEXT_REPLIES[topic];
      if (responses[topic]) {
        return `「${topic}」の続きを聞いているのかい？　同じ答えを言い換えても、情報が増えるとは限らないよ。`;
      }
      return "";
    }

    function chooseReply(message) {
      const normalizedMessage = normalize(message);
      let topic = findTopic(message);
      const lastTopic = getStoredValue("shirase_last_topic") || "";

      const followsLastTopic = lastTopic && isFollowUp(message)
        && (!topic || topic === "ヒント" || topic === lastTopic);
      const asksProjectCHelp = topic === "助けて" && lastTopic === "プロジェクトC";

      if ((topic === "ヒント" || followsLastTopic || asksProjectCHelp) && lastTopic) {
        topic = lastTopic;
        const contextual = contextualReply(topic);
        if (contextual) return { topic, reply: contextual };
      }

      if (topic === "プロジェクトC") {
        return { topic, reply: nextProjectCHint() };
      }

      const repeated = repeatedReply(topic, message, lastTopic);
      if (repeated) return { topic, reply: repeated };

      if (normalizedMessage.includes(normalize("こんに"))) {
        const reply = getPersistentValue("met_boundary")
          ? "やあ。境界線の向こう側を覗いた気分はどうだい？"
          : responses["こんに"] || "こんにちは。そこは昼かな？";
        return { topic: "こんに", reply };
      }

      if (topic && responses[topic]) {
        return { topic, reply: responses[topic] };
      }

      const questionReplies = [
        "君、それ、どこで聞いたんだい？　知ってることが混じってる。",
        "いい質問だ。でも、答えがある質問とは限らないよ。",
        "君がそれをどう解釈するか、見ものだ。"
      ];
      const statementReplies = [
        "……ごめん、その言葉は此処まで届いていないみたいだ。",
        "今の言葉は記録しておくよ。意味を持つかは、まだわからないけど。",
        "縺ｾ縺?遲斐∴縺檎畑諢上＆繧後※縺?∪縺帙ｓ"
      ];
      const pool = /[?？]|(?:なに|何|どう|なぜ|どこ|誰)/.test(message)
        ? questionReplies
        : statementReplies;
      return { topic: "", reply: pool[Math.floor(Math.random() * pool.length)] };
    }

    function appendLine(speaker, text, className) {
      const chatlog = document.getElementById("chatlog");
      const line = document.createElement("p");
      line.className = `chat-line ${className}`;

      const label = document.createElement("span");
      label.className = "speaker";
      label.textContent = `${speaker}:`;

      const message = document.createElement("span");
      message.textContent = text;

      line.append(label, message);
      chatlog.append(line);
      scrollToLatest();
    }

    function scrollToLatest() {
      const chatbox = document.getElementById("chatbox");
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function send() {
      const input = document.getElementById("chatInput");
      const message = input.value.trim();
      if (!message || input.disabled) return;

      appendLine("あなた", message, "user");

      if (normalize(message).includes(normalize("境界線"))) {
        setPersistentValue("met_boundary", "true");
      }

      const result = chooseReply(message);
      if (result.topic) setStoredValue("shirase_last_topic", result.topic);
      setStoredValue("shirase_last_input", normalize(message));

      input.value = "";
      input.focus();

      setTimeout(() => {
        appendLine("Shirase", result.reply, "shirase");
      }, 800);
    }
  </script>
</body>
