<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サイト内検索 | 江縫栄市立総合病院</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <section class="panel" role="search">
      <h1>サイト内検索</h1>
      <p class="note">ページタイトルや本文中のキーワードで検索できます。</p>
      <div class="searchbox" style="margin-top:12px">
        <input id="q" type="search" placeholder="キーワードを入力" aria-label="検索語" autocomplete="off">
        <button class="btn" onclick="doSearch()">検索</button>
      </div>
    </section>

    <div id="results" style="margin-top:8px" aria-live="polite"></div>
  </main>

  <div id="footer"></div>
  <script src="common.js"></script>
  <script>
  async function loadPart(id, file) {
    const res = await fetch(file);
    document.getElementById(id).innerHTML = await res.text();
  }
  loadPart("header", "partials/header.html");
  loadPart("footer", "partials/footer.html");

  const EXTRA_PAGES = [
    { title:"緊急放送記録 20240631250472.mp4", url:"videoarchive#record-20240631", desc:"2024年6月31日の緊急放送記録" },
    { title:"映像記録 2025023010854250475.mp4", url:"videoarchive#record-20250230", desc:"2025年2月30日の市内映像記録" },
    { title:"テレビ録画 20251233155081350097.mp4", url:"videoarchive#record-20251233", desc:"2025年12月33日のテレビ録画" }
  ];

  let searchIndexPromise;

  function normalizeText(value) {
    return String(value || "")
      .normalize("NFKC")
      .replace(/\s+/g, " ")
      .trim();
  }

  function normalizeForSearch(value) {
    return normalizeText(value).toLocaleLowerCase();
  }

  async function loadSearchIndex() {
    if (!searchIndexPromise) {
      searchIndexPromise = fetch("search-index.json", { cache: "no-cache" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => Array.isArray(data.pages) ? data.pages : []);
    }
    return searchIndexPromise;
  }

  function searchableText(page) {
    return normalizeForSearch([
      page.title,
      page.url,
      page.text,
      page.excerpt,
      page.desc,
      ...(Array.isArray(page.keywords) ? page.keywords : [])
    ].filter(Boolean).join(" "));
  }

  function countOccurrences(text, term) {
    if (!term) return 0;
    let count = 0;
    let position = 0;
    while ((position = text.indexOf(term, position)) !== -1) {
      count += 1;
      position += term.length;
      if (count >= 20) break;
    }
    return count;
  }

  function resultScore(page, query, terms, haystack) {
    const title = normalizeForSearch(page.title);
    const url = normalizeForSearch(page.url);
    let score = 0;

    if (title === query) score += 200;
    else if (title.includes(query)) score += 100;
    if (url.includes(query)) score += 30;

    for (const term of terms) {
      if (title.includes(term)) score += 25;
      score += Math.min(countOccurrences(haystack, term), 10);
    }
    return score;
  }

  function createExcerpt(page, terms) {
    const source = normalizeText(page.text || page.excerpt || page.desc || "");
    if (!source) return "";

    const normalized = source.toLocaleLowerCase();
    const positions = terms
      .map(term => normalized.indexOf(term))
      .filter(position => position >= 0);
    const matchPosition = positions.length ? Math.min(...positions) : 0;
    const start = Math.max(0, matchPosition - 45);
    const end = Math.min(source.length, matchPosition + 135);

    return `${start > 0 ? "…" : ""}${source.slice(start, end).trim()}${end < source.length ? "…" : ""}`;
  }

  function pageHref(url) {
    const value = String(url || "");
    if (/^https?:\/\//i.test(value)) return value;
    return `https://gainenull.org/${value.replace(/^\/+/, "")}`;
  }

  function triggerHiddenAccess() {
    const pass = prompt("ACCESS RESTRICTED\nPASSWORD:");
    if (!pass) return;

    const PROJECT_C_VIDEO_ID = "Unv6s1LU9rg";

    function isValidAccessKey(value) {
      const input = value.trim();

      if (input.toLowerCase() === "akashive" || input === PROJECT_C_VIDEO_ID) {
        return true;
      }

      try {
        const urlText = /^https?:\/\//i.test(input) ? input : `https://${input}`;
        const url = new URL(urlText);
        const host = url.hostname.replace(/^www\./, "").toLowerCase();

        if (host === "youtu.be") {
          return url.pathname.split("/").filter(Boolean)[0] === PROJECT_C_VIDEO_ID;
        }

        if (host === "youtube.com" || host === "m.youtube.com") {
          return url.searchParams.get("v") === PROJECT_C_VIDEO_ID;
        }
      } catch (_) {
        return false;
      }

      return false;
    }

    if (isValidAccessKey(pass)) {
      window.location.href = "https://gainenull.org/t-iui";
    } else {
      alert("読込み失敗、再度お試し下さい");
    }
  }

  async function doSearch() {
    const raw = document.getElementById("q").value.trim();
    const query = normalizeForSearch(raw);
    const out = document.getElementById("results");

    if (raw.includes("プロジェクトC")) {
      triggerHiddenAccess();
      return;
    }

    if (!query) {
      out.innerHTML = "";
      return;
    }

    out.innerHTML = '<p class="note" style="padding:8px 0">検索しています…</p>';

    let indexedPages;
    try {
      indexedPages = await loadSearchIndex();
    } catch (error) {
      console.error("Search index could not be loaded", error);
      out.innerHTML = '<p class="note" style="padding:8px 0">検索データを読み込めませんでした。時間をおいて再度お試しください。</p>';
      return;
    }

    const terms = query.split(/\s+/).filter(Boolean);
    const matched = [...indexedPages, ...EXTRA_PAGES]
      .map(page => {
        const haystack = searchableText(page);
        if (!terms.every(term => haystack.includes(term))) return null;
        return {
          page,
          score: resultScore(page, query, terms, haystack),
          excerpt: createExcerpt(page, terms)
        };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score || a.page.title.localeCompare(b.page.title, "ja"));

    if (matched.length === 0) {
      out.innerHTML = `<p class="note" style="padding:8px 0">「${escHtml(raw)}」に一致するページは見つかりませんでした。</p>`;
      return;
    }

    const items = matched.map(({ page, excerpt }) => `
      <li style="padding:12px 8px;border-top:1px dashed var(--line)">
        <a href="${escHtml(pageHref(page.url))}" style="font-size:15px;font-weight:bold">${escHtml(page.title)}</a>
        ${excerpt ? `<p class="note" style="margin:2px 0 0">${escHtml(excerpt)}</p>` : ""}
      </li>`).join("");

    out.innerHTML = `
      <p class="note" style="margin-bottom:6px">「${escHtml(raw)}」の検索結果：${matched.length}件</p>
      <ul class="list" style="list-style:none;margin:0;padding:12px">
        ${items}
      </ul>`;
  }

  function escHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const params = new URLSearchParams(location.search);
  const initQ = params.get("q");
  if (initQ) {
    document.getElementById("q").value = initQ;
    doSearch();
  }

  document.getElementById("q").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      doSearch();
    }
  });
  </script>
</body>
</html>
