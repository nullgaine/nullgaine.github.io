name: Prune pre-2026 deployments

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-pre-2026-deployments.yml

permissions:
  contents: read
  deployments: write

jobs:
  prune:
    name: Delete 490 inactive pre-2026 deployments
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect and delete old deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CUTOFF: "2026-01-01T00:00:00Z"
          EXPECTED_TARGETS: "490"
        shell: bash
        run: |
          set -euo pipefail

          targets="$(mktemp)"
          trap 'rm -f "$targets"' EXIT

          page=1
          while true; do
            response="$(
              curl --fail-with-body --silent --show-error \
                --retry 5 --retry-delay 2 --retry-all-errors \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/deployments?per_page=100&page=${page}"
            )"

            page_count="$(jq 'length' <<<"$response")"
            if [[ "$page_count" -eq 0 ]]; then
              break
            fi

            jq -r --arg cutoff "$CUTOFF" '
              .[]
              | select(.environment == "github-pages" and .created_at < $cutoff)
              | [.id, .created_at]
              | @tsv
            ' <<<"$response" >>"$targets"

            if [[ "$page_count" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

          target_count="$(wc -l <"$targets" | tr -d ' ')"
          echo "Found ${target_count} github-pages deployments before ${CUTOFF}."

          if [[ "$target_count" != "$EXPECTED_TARGETS" ]]; then
            echo "Safety stop: expected ${EXPECTED_TARGETS} targets, found ${target_count}." >&2
            exit 1
          fi

          deleted=0
          failed=0
          while IFS=$'\t' read -r deployment_id created_at; do
            if curl --fail-with-body --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/deployments/${deployment_id}"; then
              deleted=$((deleted + 1))
              echo "Deleted ${deployment_id} (${created_at}) [${deleted}/${target_count}]"
            else
              failed=$((failed + 1))
              echo "Failed ${deployment_id} (${created_at})" >&2
            fi

            # Stay below GitHub's secondary rate limits for mutating requests.
            sleep 1
          done <"$targets"

          {
            echo "### Deployment cleanup"
            echo "- Cutoff: ${CUTOFF}"
            echo "- Deleted: ${deleted}"
            echo "- Failed: ${failed}"
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "$deleted" != "$EXPECTED_TARGETS" || "$failed" -ne 0 ]]; then
            echo "Cleanup incomplete: deleted=${deleted}, failed=${failed}." >&2
            exit 1
          fi
