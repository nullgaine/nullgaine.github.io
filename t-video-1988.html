<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映像記録 V-19880815-404</title>
  <link rel="stylesheet" href="assets/archivestyle.css">
  <style>
    .video-record-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin: 18px 0;
      border: 1px solid var(--border-soft);
      background: var(--border-soft);
    }

    .video-record-meta div {
      padding: 10px 12px;
      background: var(--panel);
    }

    .video-record-meta dt,
    .video-record-meta dd {
      margin: 0;
    }

    .video-record-meta dt {
      color: var(--muted);
      font: 11px/1.4 monospace;
    }

    .video-record-meta dd {
      margin-top: 3px;
      color: var(--text);
      font-size: 13px;
    }

    .research-video {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #111;
      box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.12);
    }

    .research-video::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255, 255, 255, 0.025) 4px);
    }

    .research-video iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .research-nav {
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .video-record-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>■ 映像資料 / V-19880815-404</h1>
  </header>

  <nav class="research-nav" aria-label="研究所内ナビゲーション">
    <a class="research-home-link" href="t-iui.html">← 研究所ホームへ戻る</a>
  </nav>

  <main class="container">
    <section class="section">
      <h2>実験前説明映像</h2>
      <p class="log">東京生体情報再構築研究室 / 内部保存資料</p>

      <dl class="video-record-meta">
        <div><dt>FILE</dt><dd>19880815000000404.mp4</dd></div>
        <div><dt>RECORDED</dt><dd>1988年8月15日</dd></div>
        <div><dt>CLASS</dt><dd>C-PROJECT / PRE-EXPERIMENT</dd></div>
        <div><dt>STATUS</dt><dd>RESTORED / INTERNAL</dd></div>
      </dl>

      <div class="research-video">
        <iframe src="https://www.youtube-nocookie.com/embed/Unv6s1LU9rg?rel=0" title="19880815000000404.mp4" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>

    <section class="section">
      <h2>付記</h2>
      <p class="log">
        当該映像は、計画の実験開始前に作成された説明資料として保存されている。<br>
        原本の所在および作成者情報は未確認。
      </p>
    </section>
  </main>
</body>
</html>
